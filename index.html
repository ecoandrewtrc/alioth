<html lang="en"><head><meta charset="utf-8">

<title>David Middleton’s voyage on the USS Alioth</title>

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#0a1b27;--ink:#e3eef3;--mute:#8fa8b4;--line:#1c3646;--btn:#e3eef3;--btnink:#0a1b27}}
:root[data-theme="dark"]{--panel:#0a1b27;--ink:#e3eef3;--mute:#8fa8b4;--line:#1c3646;--btn:#e3eef3;--btnink:#0a1b27}
html,body{height:100%}body{margin:0;background:var(--panel);color:var(--ink);font:400 14px/1.45 "Public Sans",system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;height:100%}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}#map{position:absolute;inset:0;background:#e6eee9}
#stage::after{content:"";position:absolute;inset:8px;border:2.5px solid var(--chink);pointer-events:none;z-index:3}
#stage::before{content:"";position:absolute;inset:13px;border:.8px solid var(--chink);pointer-events:none;z-index:3}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
aside header{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
h1{font:700 21px/1.2 Spectral,Georgia,serif;margin:0 0 4px}aside header p{margin:0;color:var(--mute)}
#legs{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
#legs li button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:14px 1fr;gap:0 10px;width:100%;padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer}
#legs li button:hover,#legs li.now button{background:color-mix(in srgb,var(--ink) 8%,transparent)}
#legs li button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
#legs li.off{opacity:.38}.sw{grid-row:1/4;width:6px;height:100%;border-radius:3px;margin-left:4px}
.d{color:var(--mute);font-size:12px}.r{font-weight:600}.e{color:var(--mute);font-size:12.5px}
.note{padding:12px 18px;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}.note p{margin:0 0 6px}
#bar{position:absolute;left:24px;bottom:24px;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:calc(100% - 48px)}
#bar button{all:unset;cursor:pointer;background:var(--btn);color:var(--btnink);font-weight:600;padding:6px 14px;border-radius:6px}
#bar button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bar input{width:200px;max-width:34vw;accent-color:var(--ink)}#bar .t{min-width:150px;font-size:13px}
.ramp{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px}.ramp i{display:block;width:70px;height:6px;border-radius:3px}
#rose{position:absolute;right:26px;bottom:46px;width:100px;height:100px;z-index:4;pointer-events:none}
#err{display:none;position:absolute;top:24px;left:50%;transform:translateX(-50%);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;max-width:80%}
.pm{--s:12px;width:var(--s);height:var(--s);border-radius:50%;background:var(--chhalo);border:2px solid var(--chink);box-sizing:border-box;cursor:pointer}
.sd{width:10px;height:10px;cursor:pointer}.sd i{display:block;width:100%;height:100%;box-sizing:border-box;background:var(--chhalo);border:2px solid var(--chink);transform:rotate(45deg)}
.stw{font-size:24px;line-height:24px;width:24px;text-align:center;cursor:pointer;color:var(--chink);text-shadow:0 0 3px var(--chhalo),0 0 3px var(--chhalo)}
.lab{position:absolute;white-space:nowrap;pointer-events:none;font:italic 700 13px Spectral,Georgia,serif;color:var(--chink);text-shadow:0 0 3px var(--chhalo),0 0 3px var(--chhalo),0 0 4px var(--chhalo)}
.t .lab{bottom:calc(var(--s) + 2px);left:50%;transform:translateX(-50%)}.b .lab{top:calc(var(--s) + 2px);left:50%;transform:translateX(-50%)}.l .lab{right:calc(var(--s) + 4px);top:calc(var(--s)/2 - 9px)}.r .lab{left:calc(var(--s) + 4px);top:calc(var(--s)/2 - 9px)}
.stw .lab{font-size:13px;line-height:1.2;top:26px;left:50%;transform:translateX(-50%)}
.maplibregl-popup-content{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;line-height:1.4;font:400 14px/1.4 "Public Sans",sans-serif}
.maplibregl-popup-content b{font:700 15px Spectral,Georgia,serif}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--panel)}.maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:var(--panel)}
.maplibregl-popup-anchor-left .maplibregl-popup-tip{border-right-color:var(--panel)}.maplibregl-popup-anchor-right .maplibregl-popup-tip{border-left-color:var(--panel)}
.maplibregl-ctrl-attrib{font-size:10px}
#views{position:absolute;top:12px;right:12px;z-index:5;display:flex;gap:6px}
#views button{all:unset;cursor:pointer;background:var(--btn);color:var(--btnink);font-weight:600;padding:6px 12px;border-radius:6px}
#views button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bar #legsBtn{display:none}
@media (pointer:coarse){.pm{--s:20px}.sd{width:16px;height:16px}}
@media (max-width:760px){
 #app{display:block}#stage{position:fixed;inset:0}.ramp,#rose{display:none}
 #views{top:calc(12px + env(safe-area-inset-top,0px))}#views button{min-height:44px;box-sizing:border-box;display:flex;align-items:center}

 #bar .t{order:-1;flex:1 0 100%;min-width:0;font-size:13px}#bar input{flex:1;width:auto;max-width:none;min-width:80px}
 #bar button{min-height:44px;box-sizing:border-box}#bar #legsBtn{display:block}

</style></head><body>

  map.addSource('dem',{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],encoding:'terrarium',tileSize:256,maxzoom:12,attribution:'Terrain: Mapzen, AWS Open Data'});
  map.addLayer({id:'hs',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':.45,'hillshade-shadow-color':'#7a6a45','hillshade-highlight-color':'#fbf5dc','hillshade-accent-color':'#a89868'}},first.id);
  map.addLayer({id:'coast',type:'line',source:first.source,'source-layer':'water',paint:{'line-color':'#1c1a14','line-width':['interpolate',['linear'],['zoom'],2,.6,8,1.3],'line-opacity':['interpolate',['linear'],['zoom'],5.5,0,7,1]}})}
 legs.forEach((g,i)=>map.addImage('arr'+i,arrowImg(g.col),{pixelRatio:2}));
 map.addSource('legs',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
 map.addSource('legfull',{type:'geojson',data:{type:'FeatureCollection',features:legs.map((g,i)=>({type:'Feature',properties:{i,arr:'arr'+i},geometry:{type:'LineString',coordinates:cut(g,1)}}))}});
 const lc={'line-cap':'round','line-join':'round'};
 map.addLayer({id:'leg-halo',type:'line',source:'legs',layout:lc,paint:{'line-color':'#f2eedd','line-opacity':.9,'line-width':7}});
 map.addLayer({id:'leg-line',type:'line',source:'legs',layout:lc,paint:{'line-color':['get','col'],'line-width':3.5}});
 map.addLayer({id:'leg-now',type:'line',source:'legs',layout:lc,paint:{'line-color':['get','col'],'line-width':7}});
 map.addLayer({id:'leg-hit',type:'line',source:'legs',paint:{'line-color':'#000','line-opacity':.01,'line-width':16}});
 map.addLayer({id:'leg-arrow',type:'symbol',source:'legfull',layout:{'symbol-placement':'line-center','icon-image':['get','arr'],'icon-rotation-alignment':'map','icon-allow-overlap':true,'icon-ignore-placement':true}});
 ['leg-hit','leg-arrow'].forEach(id=>{map.on('click',id,e=>showPop(legs[e.features[0].properties.i].pop,e.lngLat));map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',id,()=>map.getCanvas().style.cursor='')});
 loadLand(!!first);ready=true;drawFrac(prog)}
// Natural Earth 10m land (every island it contains) drawn over the tiles at world and regional zoom; fades out as the detailed OpenStreetMap tiles take over
function loadLand(tiles){const get=u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()}),b='https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/';
 get(b+'land-10m.json').catch(()=>get(b+'land-50m.json')).then(t=>{
  map.addSource('ne',{type:'geojson',data:topojson.feature(t,t.objects.land),tolerance:.05});
  const fade=tiles?['interpolate',['linear'],['zoom'],5.5,1,7,0]:1;
  map.addLayer({id:'ne-land',type:'fill',source:'ne',paint:{'fill-color':LAND,'fill-opacity':fade}},'leg-halo');
  map.addLayer({id:'ne-coast',type:'line',source:'ne',paint:{'line-color':'#1c1a14','line-width':['interpolate',['linear'],['zoom'],2,.6,6,1.2],'line-opacity':fade}},'leg-halo')}).catch(()=>{})}
// f = number of legs drawn so far (fractional while a leg is being drawn)
function drawFrac(f){if(!ready)return;const feats=[];legs.forEach((g,i)=>{const fr=Math.min(1,Math.max(0,f-i));if(fr>0)feats.push({type:'Feature',properties:{i,col:g.col},geometry:{type:'LineString',coordinates:cut(g,fr)}})});
 map.getSource('legs').setData({type:'FeatureCollection',features:feats});map.setFilter('leg-arrow',['<=',['get','i'],f-.5]);map.setFilter('leg-now',['==',['get','i'],f>0&&f<N?Math.ceil(f)-1:-1])}
let booted=false;function boot(){if(booted)return;booted=true;clearTimeout(fb);setup()}
map.on('load',boot);
const fb=setTimeout(()=>fallback(),12000);
function fallback(){if(booted)return;booted=true;clearTimeout(fb);const e=$('err');e.style.display='block';e.textContent='Map tiles could not be loaded (internet access is needed). Showing Natural Earth world land instead.';
 map.setStyle({version:8,sources:{},layers:[{id:'bg',type:'background',paint:{'background-color':SEA}}]});map.once('styledata',()=>setup())}
map.on('error',e=>{if(!booted&&!e.sourceId&&!e.tile)fallback()});
// ports, events, labels (DOM markers)
const grp={};nodes.forEach(n=>{if(n.sea)return;const k=n.x+','+n.y;(grp[k]=grp[k]||[]).push(n)});
const labeled=[];const dirs={'San Francisco':'l',Alameda:'r',Tarawa:'b',Peleliu:'b',Kwajalein:'b',Funafuti:'b','Pearl Harbor':'b'};
function mark(el,n,html){el.addEventListener('click',ev=>{ev.stopPropagation();showPop(html,[n.X,n.y])});new maplibregl.Marker({element:el}).setLngLat([n.X,n.y]).addTo(map)}
Object.values(grp).forEach(a=>{const f=a[0],s=short(f),join=a.some(n=>n.join),el=document.createElement('div');
 const dup=labeled.some(p=>p[2]===s&&Math.abs(p[0]-f.X)<.5&&Math.abs(p[1]-f.y)<.5);labeled.push([f.X,f.y,s]);el.className=join?'stw':'pm '+(dirs[s]||'t');el.innerHTML=(join?'★':'')+(dup?'':`<span class="lab">${s}</span>`);
 mark(el,f,`<b>${nm(f)}</b>`+a.map(n=>`<br>${fmt(n.date)} — ${n.ev}${n.name&&n.name!==f.name?' ('+n.name+')':''}`).join(''))});
nodes.filter(n=>n.sea).forEach(n=>{const el=document.createElement('div');el.className='sd';el.innerHTML='<i></i>';mark(el,n,`<b>${n.name||'At sea'}</b><br>${fmt(n.date)} — ${n.ev}`)});
// timeline
const rng=$('rng'),tl=$('tl'),pb=$('play');rng.max=N;
function setProgress(f){prog=f;const k=Math.ceil(f-1e-9);step=k;rng.value=k;legs.forEach((g,i)=>{li[i].classList.toggle('off',i>=k);li[i].classList.toggle('now',f<N&&i===k-1)});drawFrac(f);
 tl.textContent=f<=0?'Voyage not started':f>=N?`All ${N} legs, in date order`:`Leg ${k} of ${N} · ${fmt(legs[k-1].a.date)}`}
function stop(){if(raf)cancelAnimationFrame(raf);raf=null;pb.textContent='Play'}
function setStep(k){stop();setProgress(k)}
pb.onclick=()=>{if(raf)return stop();const from=prog>=N?0:prog,t0=performance.now(),dur=DRAW_MS*(N-from)/N;pb.textContent='Pause';
 (function f(t){const u=Math.min(1,(t-t0)/dur);setProgress(from+(N-from)*u);if(u<1)raf=requestAnimationFrame(f);else{raf=null;pb.textContent='Play'}})(t0)};
rng.oninput=()=>setStep(+rng.value);
setProgress(N);
$('sub').textContent=`USS Alioth (AK-109) · ${fmt(nodes[0].date)} to ${fmt(nodes[nodes.length-1].date)} · ${N} legs`;
$('r0').textContent=fmt(legs[0].a.date).replace(/ \d+,/,'');$('r1').textContent=fmt(legs[N-1].a.date).replace(/ \d+,/,'');
$('rp').style.background=`linear-gradient(90deg,${stops.join(',')})`;
$('notes').innerHTML='<p>Port stays have no length, so they appear as port markers (click one for arrival and departure dates). Diamonds mark events at sea; the star marks where David Middleton joined the ship.</p><p>Basemap: OpenFreeMap vector tiles (OpenStreetMap data) restyled as a chart, Natural Earth 10m land for every island at wide zoom, and terrain shading from AWS terrain tiles. All text labels except your ports are removed.</p>'+D.notes.map(t=>`<p>${t}</p>`).join('');

$('legsBtn').onclick=()=>{const o=document.body.classList.toggle('sheet');$('legsBtn').setAttribute('aria-expanded',o)};
map.on('click',()=>document.body.classList.remove('sheet'));
$('vRoute').onclick=()=>map.fitBounds(bnd(nodes),{padding:pad(),duration:RMS()});
$('vWorld').onclick=()=>map.easeTo({center:[180,12],zoom:Math.max(-0.5,Math.log2(map.getContainer().clientWidth/512)),duration:RMS()});
// hide port labels that would overlap; they come back as you zoom in
function declutter(){const pl=[];[...document.querySelectorAll('.lab')].sort((a,b)=>(b.parentNode.classList.contains('stw')?1:0)-(a.parentNode.classList.contains('stw')?1:0)).forEach(l=>{l.style.visibility='visible';const r=l.getBoundingClientRect();
 if(pl.some(q=>r.left<q.right+3&&r.right+3>q.left&&r.top<q.bottom&&r.bottom>q.top))l.style.visibility='hidden';else pl.push(r)})}
map.on('idle',declutter);addEventListener('resize',declutter);

// ---- ambient sound: looping audio file (ambient.mp3, kept next to this page), with an on/off toggle ----
const AUDIO_SRC='ambient.mp3',SND={on:true,run:false,failed:false},sb=$('vSound'),au=new Audio(AUDIO_SRC);
au.loop=true;au.preload='auto';au.volume=.7;
try{SND.on=localStorage.getItem('alioth-sound')!=='off'}catch(e){}
function sLabel(){sb.textContent=SND.failed?'Sound unavailable':!SND.on?'Sound off':SND.run?'Sound on':'Tap for sound';sb.setAttribute('aria-pressed',SND.on&&!SND.failed)}
function soundStart(){if(!SND.on||SND.failed)return;au.play().then(()=>{SND.run=true;sLabel()}).catch(()=>{SND.run=false;sLabel()})}
function soundStop(){au.pause();SND.run=false;sLabel()}
au.addEventListener('error',()=>{SND.failed=true;SND.run=false;sLabel()});
sb.onclick=()=>{SND.on=!SND.on;try{localStorage.setItem('alioth-sound',SND.on?'on':'off')}catch(e){}SND.on?soundStart():soundStop()};
// browsers usually block sound until a tap, click or key press, so if autoplay is blocked it starts on the first one
const unlock=()=>{if(SND.on&&!SND.run)soundStart();else if(SND.run)['click','touchend','keydown'].forEach(e=>removeEventListener(e,unlock))};
['click','touchend','keydown'].forEach(e=>addEventListener(e,unlock,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden){au.pause();SND.run=false;sLabel()}else if(SND.on)soundStart()});
sLabel();soundStart();
